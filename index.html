 "Codex may select this skill when your task matches its description. Use $research to request it directly.", "localUrl": "skills/research/SKILL.md"}, {"id": "tdd", "title": "TDD bug fix", "source": "pstack", "category": "Build", "summary": "Capture a cheap behavioral regression before a bug fix, then prove it passes afterward.", "when": ["A bug has a cheap local regression test.", "You explicitly want failing-before and passing-after evidence."], "notice": ["A focused behavior test fails before the implementation changes.", "The smallest fix makes it pass, followed by relevant adjacent checks."], "steps": ["Reproduce the bug with the nearest focused test.", "Make the smallest fix after observing the failure.", "Rerun the regression and relevant adjacent checks."], "prompt": "Use $tdd to reproduce and fix an AzerothCore reward calculation bug using its existing local test setup.", "output": "A focused fix and behavioral regression with before-and-after evidence.", "limits": ["Skip disproportionate new test infrastructure with a stated reason.", "No assertion weakening or unrelated fixture churn."], "related": ["diagnosing-bugs", "blast-radius", "code-review"], "adaptation": "Retained cheap-test preference and corrected treatment of absence assertions; no runtime authority expansion.", "invocation": "explicit", "keywords": "test behavior red green refactor regression", "invocationLabel": "Explicit request", "invocationText": "Request this skill directly with $tdd. Its installed policy disables automatic selection.", "sourceUrl": "https://github.com/cursor/plugins/tree/df3fb154fb982fb83f649de8646d4af6a0cb16b3/pstack/skills/tdd", "localUrl": "skills/tdd/SKILL.md"}, {"id": "technical-writing", "title": "Technical writing", "source": "pstack", "category": "Write", "summary": "Write clear technical documents using task-appropriate structure, precise names, and plain instructions.", "when": ["An RFC, README, how-to guide, or PR description needs a clear structure.", "Techn ndary. [Paste draft here.]", "output": "An edited draft with clearer language and the same factual meaning.", "limits": ["A language edit does not fact-check the underlying claims.", "Existing installation is preserved, including its legacy invocation metadata."], "related": ["technical-writing", "writing-for-agents", "handoff"], "adaptation": "Already installed before this collection. Its original SKILL.md is unchanged. It has legacy disable-model-invocation metadata and no Codex agents/openai.yaml policy; this guide does not promise automatic selection.", "invocationLabel": "Existing · invoke directly", "invocationText": "Use $unslop explicitly. The existing description says to always apply, but its legacy metadata is not a verified Codex automatic-selection policy.", "sourceUrl": "https://github.com/cursor/plugins/blob/df3fb154fb982fb83f649de8646d4af6a0cb16b3/pstack/skills/unslop/SKILL.md", "localUrl": "skills/unslop/SKILL.md"}, {"id": "why", "title": "Why it exists", "source": "pstack", "category": "Understand", "summary": "Investigate design rationale and history while separating documented facts from inference.", "when": ["A design decision or defensive check has unclear motivation.", "You need to know which historical constraints still matter."], "notice": ["The agent distinguishes documented decisions from plausible inference.", "Missing historical evidence remains explicitly unknown."], "steps": ["Anchor the question in code and canonical decisions.", "Follow only relevant history and linked evidence.", "Report rationale with calibrated confidence and change constraints."], "prompt": "Use $why to investigate why Plenum separates Thread history from Run execution, using canonical docs and local history first.", "output": "A cited rationale with confidence, competing evidence, and remaining gaps.", "limits": ["No mandatory external-system sweep or fabricated intent.", "No messages, Git mutations, or memory writes implied."], "related": ["how", "research", "bl cdbdebbff572ccafa662551015/skills/productivity/writing-for-agents", "keywords": "AGENTS.md instructions context prompt skill", "invocationLabel": "Automatic eligible", "invocationText": "Codex may select this skill when your task matches its description. Use $writing-for-agents to request it directly.", "localUrl": "skills/writing-for-agents/SKILL.md"}]</script>
<script>
'use strict';
const skills=JSON.parse(document.getElementById('skill-data').textContent), $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved=[];try{saved=JSON.parse(localStorage.getItem('skill-desk-saved')||'[]');if(!Array.isArray(saved))saved=[]}catch{}let view='all',category='',selected=skills.some(s=>s.id===location.hash.slice(1))?location.hash.slice(1):'diagnosing-bugs',query='',timer;
const cats=['Understand','Design','Build','Verify','Write','Continue'];
$('#categories').innerHTML=cats.map(c=>`<button data-category="${c}">${c}</button>`).join('');
const list=a=>`<ul>${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
function toast(t){$('#toast').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',3200)}
function filtered(){let terms=query.toLowerCase().trim().split(/\s+/).filter(Boolean);return skills.filter(s=>(!category||s.category===category)&&(view!=='saved'||saved.includes(s.id))&&terms.every(t=>JSON.stringify(s).toLowerCase().includes(t)))}
function select(id){selected=id;try{history.replaceState(null,'','#'+id)}catch{location.hash=id}render()}
function detail(s){return `<article class="detail"><div class="detail-top"><span class="eyebrow">${esc(s.category)} / SKILL</span><span class="source">${esc(s.source)}</span></div><h1>${esc(s.id)}</h1><p class="lead">${esc(s.summary)}</p><div><span class="tag">${esc(s.invocationLabel)}</span><button class="button" id="save" aria-pressed="${saved.includes(s.id)}">${saved.includes(s.id)?'Saved ✓':'Save skill'}</button></div><div class="columns"><section><h2>When to use</h2>${list(s.when)}</section><section><h2>What you'll notice</h2>${list(s.notice)}</section></div><div class="prompt"><div class="prompt-head"><span>Try this in Codex</span><button class="button primary" data-copy="${esc(s.id)}">Copy prompt</button></div><pre>${esc(s.prompt)}</pre></div><div class="columns"><section><h2>What it does</h2><ol>${(s.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section><section><h2>What you get</h2><p>${esc(s.output)}</p><h3>How it starts</h3><p>${esc(s.invocationText)}</p></section></div><div class="bottom"><h2>Limits to keep in mind</h2>${list(s.limits)}<details><summary>Source and local adaptations</summary><p>${esc(s.adaptation)}</p><div class="source-links"><a href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">Read the pinned original</a> · <a href="${esc(s.localUrl)}">Open bundled instructions</a></div></details><h3>Related skills</h3><div class="related">${(s.related||[]).filter(id=>skills.some(x=>x.id===id)).map(id=>`<button class="button" data-skill="${esc(id)}">${esc(id)}</button>`).join('')}</div></div></article>`}
function overview(){return `<div class="page"><div class="intro"><span class="eyebrow">A field guide for your work</span><h1>The right instructions,<br>at the right moment.</h1><p class="lead">Your combined pstack and AI Hero shortlist, adapted for Codex and the projects you actually work on.</p><p>A skill is a reusable set of instructions. It gives Codex a method for a particular job. The result is still work you can inspect: a diagnosis, a review, a model, a prototype or a handoff.</p></div><div class="notice"><strong>Start with one skill.</strong> Copy its prompt, add the relevant project and describe the result you want. Keep your normal task in the same conversation.</div><h2>How to use this collection</h2><div class="recipe"><h3>Invoke it directly</h3><p>Type <code>$skill-name</code> in your request, or copy an example from this guide. For example: <code>$blast-radius Assess this proposed SQLite migration.</code> If the app doesn't recognize it, name the skill in plain text and point to its installed instructions.</p></div><div class="recipe"><h3>Recognize it in use</h3><p>Codex should name the skill when it first applies it. Check the entry's “What you'll notice” section for the expected method and output. This guide is a reference; it does not track active skills or task progress.</p></div><div class="recipe"><h3>Automatic or explicit</h3><p>Six AI Hero skills are eligible for automatic selection when a request matches their descriptions. The other new skills preserve an explicit invocation policy. Automatic selection is a possibility, so invoke a skill directly when you want to be sure.</p></div><div class="recipe"><h3>Available in your tasks</h3><p>This portable copy includes the skill folders. Follow INSTALL-ON-MAC.md to install them on this Mac, then start a new turn. If additions do not appear, restart Codex. The guide itself works by double-clicking this file and needs no server.</p></div><div class="rule"></div><h2>Good starting points for your projects</h2>${[
['Something broke','diagnosing-bugs','Use the exact symptom and retained evidence to narrow the cause before changing code.'],
['A change has consequences','blast-radius','Map callers, data, permissions and user paths before changing a shared contract.'],
['The domain is getting tangled','domain-modeling','Work through concrete scenarios and define the concepts and rules the code must preserve.'],
['You need to see an idea','prototype','Explore an interface in an isolated prototype before deciding how to build it.'],
['A task needs review','code-review','Review a named change scope with project-specific constraints and actionable findings.'],
['You are switching tasks','handoff','Leave a compact next-session entry with evidence, exact scope and unresolved work.']
].map(([label,id,text])=>`<div class="recipe"><h3>${label}</h3><p><button class="text-link" data-skill="${id}">${id}</button><br>${text}</p></div>`).join('')}<div class="rule"></div><h2>How the overlapping skills differ</h2><p><strong>domain-modeling</strong> runs a modeling exercise. <strong>principle-model-the-domain</strong> is a narrower check on whether the code expresses that model. <strong>technical-writing</strong> organizes a technical document, <strong>writing-for-agents</strong> shapes instructions for an agent, and <strong>unslop</strong> edits the prose. <strong>tdd</strong> guides a behavior change, while the two verification skills create and maintain a repeatable project check.</p><p>The installed copies preserve the useful methods and replace tool-specific assumptions. They follow your existing task scope and project authority. A skill invocation does not itself authorize a deployment, real provider run or destructive action.</p><p class="check">Collection: 11 pstack additions, 7 AI Hero additions, 1 existing unslop. One pstack TDD implementation avoids installing duplicate skills with the same name.</p><p class="source-links"><a href="https://developers.openai.com/codex/skills" target="_blank" rel="noopener">Codex skill documentation</a> · <a href="OVERVIEW.md">Text overview</a> · <a href="INSTALL-ON-MAC.md">Install on Mac</a> · <a href="SKILLS-EXPORT.md">Full skill export</a> · <a href="installation-manifest.json">Installation record</a></p></div>`}
function reference(){return `<div class="page"><span class="eyebrow">Keep this beside your task</span><h1>Quick reference</h1><p class="lead">Choose by the job in front of you. Open an entry for a ready-to-copy example.</p><table class="reference"><thead><tr><th>Invoke</th><th>Use it to</th><th>Starts</th></tr></thead><tbody>${filtered().map(s=>`<tr><td><button class="text-link" data-skill="${esc(s.id)}"><code>$${esc(s.id)}</code></button></td><td>${esc(s.summary)}</td><td>${esc(s.invocationLabel)}</td></tr>`).join('')}</tbody></table>${filtered().length?'':'<p>No matching skills. Try a shorter search.</p>'}<p class="check">Print guide includes all 19 skills and their example prompts, regardless of filters.</p></div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view&&!category));document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===category));if(view==='overview'){$('#content').innerHTML=overview();return}if(view==='reference'){$('#content').innerHTML=reference();return}let matches=filtered();if(!matches.some(s=>s.id===selected)&&matches.length)selected=matches[0].id;let s=matches.find(s=>s.id===selected);$('#content').innerHTML=`<div class="workspace"><section class="skill-list" aria-label="Skills"><div class="list-head"><strong>${esc(category||(view==='saved'?'Saved skills':'All skills'))}</strong><span>${matches.length} skills</span></div>${matches.map(x=>`<button class="skill-row ${x.id===selected?'active':''}" data-skill="${esc(x.id)}" aria-pressed="${x.id===selected}"><span class="row-name">${esc(x.id)}</span><span class="row-summary">${esc(x.summary)}</span><span class="row-meta">${esc(x.source)} · ${esc(x.category)}</span></button>`).join('')||'<p class="empty">No skills here yet. Try another search or save a skill from the full list.</p>'}</section>${s?detail(s):'<div class="detail"><h1>No matches</h1><p class="lead">Clear your search or choose All skills.</p><button class="button" id="reset">Show all skills</button></div>'}</div>`}
async function copy(id){let text=skills.find(s=>s.id===id).prompt;try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);toast('Prompt copied')}catch{let el=document.createElement('textarea');el.value=text;el.setAttribute('aria-label','Prompt to copy');el.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px';document.body.append(el);el.select();let ok=false;try{ok=document.execCommand('copy')}catch{}el.remove();if(ok)toast('Prompt copied');else{toast('Copy unavailable. Select the prompt text and copy it.');let p=document.querySelector('pre');if(p){let r=document.createRange();r.selectNodeContents(p);let sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}}}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;category='';query='';$('#search').value='';render()}else if(b.dataset.category){category=b.dataset.category;view='all';render()}else if(b.dataset.skill){let fromLink=!b.classList.contains('skill-row');if(fromLink){view='all';category='';query='';$('#search').value=''}select(b.dataset.skill);if(fromLink){let h=$('.detail h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});h.scrollIntoView({block:'nearest'})}}}else if(b.dataset.copy)copy(b.dataset.copy);else if(b.id==='save'){saved=saved.includes(selected)?saved.filter(x=>x!==selected):[...saved,selected];let persisted=true;try{localStorage.setItem('skill-desk-saved',JSON.stringify(saved))}catch{persisted=false}render();$('#save')?.focus();toast(persisted?'Saved list updated':'Saved for this visit. Browser storage is unavailable.')}else if(b.id==='reset'){view='all';category='';query='';$('#search').value='';render()}else if(b.id==='print')window.print()});
$('#search').addEventListener('input',e=>{query=e.target.value;if(view==='overview')view='all';render()});document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'&&document.activeElement===$('#search')){$('#search').value='';query='';render()}});
$('#printguide').innerHTML='<h1>Skill desk</h1><p>Personal reference · 18 new skills + existing unslop · September 2026</p><p>Invoke a skill with $skill-name and a concrete task. Explicit means request it directly; automatic eligible means Codex may select it when relevant. This guide does not track active skills.</p>'+skills.map(s=>`<article><h2>${esc(s.id)}</h2><p class="meta">${esc(s.source)} · ${esc(s.category)} · ${esc(s.invocationLabel)}</p><p>${esc(s.summary)}</p><p><strong>Notice:</strong> ${esc(s.notice.join(' '))}</p><p><code>${esc(s.prompt)}</code></p></article>`).join('');render();
</script></body></html>
